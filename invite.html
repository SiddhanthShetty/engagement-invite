<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#2b2420;color:#eadfcb;font-family:'Source Sans 3',sans-serif;min-height:100vh;padding:24px 16px;

  input{font:500 15px 'Source Sans 3',sans-serif;padding:7px 9px;border-radius:6px;border:1px solid #5a4a3a;background:#3a302a;color:#fff}

  button:hover{background:#8e6424}
  canvas{width:min(460px,100%);height:auto;box-shadow:0 10px 40px rgba(0,0,0,.45);display:block}
  body.export{padding:0;background:#000}
  body.export .panel{display:none}
  body.export canvas{width:736px;box-shadow:none}
</style>

<body>
<div class="panel">
  <h1>Edit invite</h1>
  <label>Name 1<input id="name1" value="Sweekruti"></label>
  <label>Name 2<input id="name2" value="Siddhanth"></label>
  <label>Day (number)<input id="day" value="10"></label>
  <label>Day suffix<input id="suffix" value="th"></label>
  <label>Month, year and day<input id="date" value="DECEMBER 2026 | THURSDAY"></label>
  <label>Time<input id="time" value="11:30 AM ONWARDS"></label>
  <label>Venue<input id="venue" value="THE BRICK HOUSE AND BANQUETS"></label>
  <label>Address line<input id="addr" value="Sector 6, Kharghar, Panvel, Maharashtra 410210"></label>
  <label>City (bold)<input id="city" value="KHARGHAR"></label>
  <label>Google Maps link (for QR code)<input id="maps" value="https://maps.google.com/?q=The+Brick+House+and+Banquets+Kharghar"></label>
  <label>QR caption<input id="qrcap" value="Scan for location"></label>
  <label>Blessing line 1<input id="b1" value="With the blessings of our families,"></label>
  <label>Blessing line 2<input id="b2" value="we warmly invite our friends and family"></label>
  <label>Blessing line 3<input id="b3" value="to celebrate the engagement of"></label>
  <button id="dl">Download PNG</button>
</div>

<script>
const W = 736, H = 1308, K = 2, CX = 381;
const MAROON = '#4b1519', INK = '#3b1f1b';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const bg = new Image();
const $ = id => document.getElementById(id).value;

function font(weight, size, fam){ return `${weight} ${size}px ${fam}`; }
function fitSize(text, weight, fam, maxW, size){
  ctx.font = font(weight, size, fam);
  const w = ctx.measureText(text).width;
  return w > maxW ? size * maxW / w : size;
}
function centered(text, y, weight, size, fam, color, maxW){
  if (!text) return;
  const s = maxW ? fitSize(text, weight, fam, maxW, size) : size;
  ctx.font = font(weight, s, fam);
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText(text, CX, y);
}
// Title word: large first letter (curly script E, plain serif C), Cinzel for the rest
const FIRST = {
  E: { f: "400 58px 'Pinyon Script'", dx: 3, bold: 1.1 },
  C: { f: "500 47px 'Cinzel'", dx: 0 },
};
function titleWord(word, y){
  const first = word[0], rest = word.slice(1);
  const st = FIRST[first] || { f: "500 47px 'Cinzel'", dx: 0 };
  ctx.font = st.f;                       const w1 = ctx.measureText(first).width + st.dx;
  ctx.font = font(500, 38, "'Cinzel'");  const w2 = ctx.measureText(rest).width;
  const x0 = CX - (w1 + w2) / 2;
  ctx.fillStyle = MAROON; ctx.textAlign = 'left';
  ctx.font = st.f;                       ctx.fillText(first, x0, y);
  if (st.bold) { ctx.strokeStyle = MAROON; ctx.lineWidth = st.bold; ctx.lineJoin = 'round'; ctx.strokeText(first, x0, y); }
  ctx.font = font(500, 38, "'Cinzel'");  ctx.fillText(rest, x0 + w1, y);
}
function goldText(text, y, size, maxW){
  if (!text) return;
  const s = fitSize(text, 400, "'Great Vibes'", maxW, size);
  ctx.font = font(400, s, "'Great Vibes'");
  ctx.textAlign = 'center';
  const g = ctx.createLinearGradient(0, y - s*0.8, 0, y + s*0.2);
  g.addColorStop(0, '#d9b56a'); g.addColorStop(.5, '#b4853a'); g.addColorStop(1, '#8a5d22');
  ctx.save();
  ctx.shadowColor = 'rgba(90,55,15,.35)'; ctx.shadowBlur = 1.5; ctx.shadowOffsetY = .8;
  ctx.fillStyle = g; ctx.fillText(text, CX, y);
  ctx.restore();
}
function dateLine(y){
  const day = $('day'), suf = $('suffix'), rest = ' ' + $('date');
  const F = "'Source Sans 3'";
  let size = 27;
  const measure = () => {
    ctx.font = font(700, size, F); const a = ctx.measureText(day).width, c = ctx.measureText(rest).width;
    ctx.font = font(700, size*0.55, F); const b = ctx.measureText(suf).width;
    return [a, b, c];
  };
  let [a, b, c] = measure();
  if (a + b + c > 560) { size *= 560 / (a + b + c); [a, b, c] = measure(); }
  let x = CX - (a + b + c) / 2;
  ctx.fillStyle = MAROON; ctx.textAlign = 'left';
  ctx.font = font(700, size, F); ctx.fillText(day, x, y); x += a;
  ctx.font = font(700, size*0.55, F); ctx.fillText(suf, x, y - size*0.38); x += b;
  ctx.font = font(700, size, F); ctx.fillText(rest, x, y);
}

function draw(){
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.drawImage(bg, 0, 0, W, H);
  const S = "'Source Sans 3'";
  titleWord('ENGAGEMENT', 362);
  titleWord('CEREMONY', 410);
  centered($('b1'), 467, 500, 20, S, INK, 400);
  centered($('b2'), 494, 500, 20, S, INK, 400);
  centered($('b3'), 521, 500, 20, S, INK, 400);
  goldText($('name1'), 603, 60, 430);
  goldText('&', 668, 50, 60);
  goldText($('name2'), 730, 60, 430);
  centered('on', 777, 500, 20, S, INK);
  dateLine(814);
  centered($('time'), 843, 600, 19, S, INK, 400);
  centered('Venue:', 893, 500, 20, S, INK);
  centered($('venue'), 922, 600, 20, S, INK, 450);
  centered($('addr'), 946, 500, 16.5, S, INK, 430);
  centered($('city'), 978, 700, 26, S, MAROON, 420);
  drawQR(S);
}

function drawQR(S){
  const url = $('maps').trim();
  if (!url || typeof qrcode === 'undefined') return;
  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  const n = qr.getModuleCount(), size = 112, quiet = 8, cell = size / n;
  const x0 = CX - size/2, y0 = 1006;
  // cream card with thin gold frame behind the code
  ctx.save();
  ctx.shadowColor = 'rgba(80,50,20,.18)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 1;
  ctx.fillStyle = '#fbf7ef';
  roundRect(x0 - quiet, y0 - quiet, size + quiet*2, size + quiet*2, 6); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = '#b4853a'; ctx.lineWidth = 1.2;
  roundRect(x0 - quiet + 2.5, y0 - quiet + 2.5, size + quiet*2 - 5, size + quiet*2 - 5, 4); ctx.stroke();
  ctx.fillStyle = '#3a1215';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (qr.isDark(r, c)) ctx.fillRect(x0 + c*cell, y0 + r*cell, cell + .35, cell + .35);
  centered($('qrcap'), y0 + size + quiet + 20, 600, 15, S, INK, 200);
}
function roundRect(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}

function init(){
  if (location.hash === '#export') document.body.classList.add('export');
  document.querySelectorAll('input').forEach(i => i.addEventListener('input', draw));
  bg.onload = () => {
    draw();
    // redraw as each web font arrives; drawing never waits on them
    ['400 58px "Pinyon Script"', '500 38px "Cinzel"', '400 60px "Great Vibes"',
     '500 20px "Source Sans 3"', '600 20px "Source Sans 3"', '700 20px "Source Sans 3"']
      .forEach(f => document.fonts.load(f).then(draw, () => {}));
    document.fonts.ready.then(draw);
  };
  bg.onerror = () => alert('Background image failed to load.');
  bg.src = window.INVITE_BG;
}
document.getElementById('dl').addEventListener('click', () => {
  draw();
  const a = document.createElement('a');
  a.download = 'engagement-invite.png';
  a.href = cv.toDataURL('image/png');
  document.body.appendChild(a); a.click(); a.remove();
});
init();
</script>
</body>
</html>

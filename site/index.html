<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sweekruti &amp; Siddhanth · Engagement</title>
<meta name="description" content="Join us for the engagement ceremony of Sweekruti &amp; Siddhanth on 10th December 2026 at The Brick House and Banquets, Kharghar.">
<meta property="og:title" content="Sweekruti &amp; Siddhanth · Engagement Ceremony">
<meta property="og:description" content="Thursday, 10th December 2026 · 11:30 AM onwards · The Brick House and Banquets, Kharghar">
<meta property="og:image" content="https://sweekruti-siddhanth-engagement.vercel.app/assets/preview.jpg">
<meta property="og:image:width" content="675">
<meta property="og:image:height" content="1119">
<meta property="og:url" content="https://sweekruti-siddhanth-engagement.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:type" content="website">
<meta name="theme-color" content="#efe7da">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Pinyon+Script&family=Great+Vibes&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efe7da; --paper-dk:#e3d8c5; --maroon:#4b1519; --ink:#3b1f1b;
    --gold:#b4853a; --gold-lt:#e2c27d; --gold-dk:#8a5d22;
    --col: min(100vw, 460px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Source Sans 3',sans-serif;color:var(--ink);background:#2a211c;
       min-height:100vh;overflow-x:hidden}
  body:not(.open){overflow:hidden;height:100vh}
  /* soft blurred paper around the card on wide screens */
  .backdrop{position:fixed;inset:0;background:url(assets/paper.jpg) center/cover;filter:blur(2px) brightness(.55);transform:scale(1.05);z-index:-1}

  main{width:100%;background:var(--paper)}

  /* ---------- the card ---------- */
  /* the card fills the screen; each corner's artwork stays pinned to its own corner */
  .card{position:relative;width:100%;height:100vh;height:100svh;min-height:520px;overflow:hidden;background:var(--paper)}
  .card .paper{position:absolute;inset:0;background:url(assets/paper.jpg) center/cover;transform-origin:50% 40%}
  .card svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
  .card svg *{transform-box:fill-box}

  /* everything waits for the gate to open */
  .a{animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
  body:not(.open) .a, body:not(.open) .loop{animation-play-state:paused}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fromLeft{from{opacity:0;transform:translateX(-60px) rotate(-6deg)}to{opacity:1;transform:none}}
  @keyframes fromTop{from{transform:translateY(-105%)}to{transform:none}}
  @keyframes fromBottom{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
  @keyframes settle{from{transform:scale(1.06)}to{transform:scale(1)}}

  @keyframes swing{0%{transform:rotate(-2.2deg)}100%{transform:rotate(2.2deg)}}
  @keyframes sway{0%{transform:rotate(-1.4deg)}100%{transform:rotate(1.2deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes glow{0%,100%{opacity:.25}50%{opacity:.7}}

  .bg{animation:settle 3s ease-out both}
  .in-leaf{animation-name:fromLeft;animation-duration:1.6s;animation-delay:.2s}
  .in-banana{animation-name:fromLeft;animation-duration:1.6s;animation-delay:.45s}
  .in-lamp1{animation-name:fromTop;animation-duration:1.5s;animation-delay:.35s}
  .in-lamp2{animation-name:fromTop;animation-duration:1.8s;animation-delay:.6s}
  .in-ganesha{animation-name:fromBottom;animation-duration:1.5s;animation-delay:.5s}
  .in-bird{animation-name:fromBottom;animation-duration:1.5s;animation-delay:.7s}
  .in-lotus{animation-name:fromBottom;animation-duration:1.4s;animation-delay:.85s}

  .t{animation-name:fadeUp;animation-duration:1.1s}
  .t1{animation-delay:1.1s}.t2{animation-delay:1.5s}.t3{animation-delay:1.7s}.t4{animation-delay:1.9s}
  .t5{animation-delay:2.3s}.t6{animation-delay:2.8s}.t7{animation-delay:3.1s}
  .t8{animation-delay:3.5s}.t9{animation-delay:3.7s}.t10{animation-delay:3.9s}
  .t11{animation-delay:4.2s}.t12{animation-delay:4.35s}.t13{animation-delay:4.5s}.t14{animation-delay:4.65s}.t15{animation-delay:4.9s}
.t16{animation-delay:5.05s}
  .cardbtn{cursor:pointer;outline:none}.cardbtn:hover rect:first-child{filter:brightness(1.06) drop-shadow(0 3px 5px rgba(90,55,15,.3))}
  .cardbtn:focus-visible rect:first-child{stroke:#4b1519;stroke-width:3}

  .swing1{transform-origin:50% 0;animation:swing 3.6s ease-in-out 2s infinite alternate}
  .swing2{transform-origin:50% 0;animation:swing 4.4s ease-in-out 2.4s infinite alternate-reverse}
  .sway-leaf{transform-origin:0% 100%;animation:sway 5s ease-in-out 2s infinite alternate}
  .sway-banana{transform-origin:40% 0%;animation:sway 4.2s ease-in-out 2.2s infinite alternate-reverse}
  .bob{animation:bob 4s ease-in-out 2.4s infinite}
  .glow{animation:glow 3.2s ease-in-out 2.5s infinite}

  .petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .petal{position:absolute;top:-4%;width:clamp(7px,.9vmax,12px);aspect-ratio:1/1.6;border-radius:0 100% 0 100%;
         background:linear-gradient(135deg,#fbe1e6,#e48aa0 55%,#b9536a);opacity:0;box-shadow:0 1px 2px rgba(120,40,60,.15);
         animation:fall linear infinite}
  .petal.m{background:linear-gradient(135deg,#fff1bf,#f3b23c 55%,#d77d22)}
  @keyframes fall{
    0%{opacity:0;transform:translate(0,0) rotate(0)}
    8%{opacity:.9}
    90%{opacity:.85}
    100%{opacity:0;transform:translate(var(--dx),112vh) rotate(var(--r))}
  }
  body:not(.open) .petal{animation-play-state:paused}

  /* ---------- opening gate ---------- */
  .gate{position:fixed;inset:0;z-index:50;display:flex;cursor:pointer;-webkit-tap-highlight-color:transparent}
  /* deep maroon, with the handmade paper's own grain over it */
  .door{flex:1;background:radial-gradient(ellipse 90% 70% at 50% 42%, #7a1626 0%, #3f0812 55%, #1c0207 100%);background-size:200% 100%;position:relative;transition:transform 1.4s cubic-bezier(.7,0,.3,1)}
  .door::after{content:"";position:absolute;inset:14px;border:1.5px solid rgba(201,161,79,.75);border-radius:2px}
  .door.l{background-position:0 0}
  .door.r{background-position:100% 0}
  .door::before{content:"";position:absolute;inset:0;background:url(assets/paper-grain.jpg) center/cover;mix-blend-mode:overlay;opacity:.9}
  .door.l::after{right:0;border-right:0}
  .door.r::after{left:0;border-left:0}
  .door.l{box-shadow:inset -10px 0 22px rgba(0,0,0,.35)}
  .door.r{box-shadow:inset 10px 0 22px rgba(0,0,0,.35)}
  .seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;transition:opacity .5s}
  .seal .ring{position:relative;display:block;width:150px;height:150px;margin:0 auto;border-radius:50%;
     box-shadow:-2px -2px 5px rgba(255,220,200,.18), 4px 6px 10px rgba(0,0,0,.45), 10px 14px 30px rgba(0,0,0,.4)}
  .seal .ring img{display:block;width:100%;height:100%;border-radius:50%;filter:contrast(1.06) saturate(1.05)}
  .seal .ring::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
     box-shadow:inset 3px 4px 5px rgba(255,255,255,.75), inset -4px -5px 8px rgba(90,55,15,.35), inset 0 0 0 1px rgba(150,110,40,.25);
     background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 45%)}
  .seal p{margin-top:18px;font:600 13px 'Source Sans 3';letter-spacing:3px;text-transform:uppercase;color:#c9a14f}
  .seal .tap{margin-top:16px;font:600 12px 'Source Sans 3';letter-spacing:2px;color:#d9b97a;opacity:.7;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
  body.open .gate .door.l{transform:translateX(-102%)}
  body.open .gate .door.r{transform:translateX(102%)}
  body.open .seal{opacity:0}
  body.gone .gate{display:none}

  /* ---------- RSVP sheet ---------- */
  .sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;visibility:hidden}
  .sheet.show{visibility:visible}
  .sheet .shade{position:absolute;inset:0;background:rgba(28,2,7,.55);opacity:0;transition:opacity .35s}
  .sheet.show .shade{opacity:1}
  .panel{position:relative;width:min(100%,460px);max-height:92vh;max-height:92svh;overflow:auto;overscroll-behavior:contain;
     background:#fbf7ef url(assets/paper.jpg) center/cover;border-radius:20px 20px 0 0;border-top:3px solid #b4853a;
     padding:22px 22px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.35);
     transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);color:#3b1f1b}
  .sheet.show .panel{transform:none}
  .panel h2{font:500 26px 'Cinzel';color:#4b1519;text-align:center;letter-spacing:1px}
  .panel .sub{text-align:center;font-size:14.5px;color:#6b5040;margin-top:2px}
  .panel .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(180,133,58,.5);
     background:rgba(255,255,255,.5);color:#4b1519;font-size:22px;line-height:1;cursor:pointer}
  .f{margin-top:16px}
  .f > label,.f legend{display:block;font:600 14px 'Source Sans 3';color:#4b1519;margin-bottom:6px;padding:0}
  .f input[type=text],.f input[type=tel],.f select,.f textarea{width:100%;font:400 16px 'Source Sans 3';color:#3b1f1b;
     background:rgba(255,255,255,.75);border:1.5px solid rgba(180,133,58,.55);border-radius:10px;padding:11px 12px;outline:none}
  .f textarea{min-height:76px;resize:vertical}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:#8a5d22;box-shadow:0 0 0 3px rgba(201,160,79,.25)}
  .f .hint{font-size:12.5px;color:#7a5d4b;margin-top:4px}
  .f .err{font-size:13px;color:#a3162a;margin-top:5px;display:none}
  .f.bad .err{display:block}
  .f.bad input,.f.bad .choice{border-color:#a3162a}
  fieldset{border:0;padding:0;margin:0}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .choice{position:relative;display:block;border:1.5px solid rgba(180,133,58,.55);border-radius:12px;padding:12px 8px;text-align:center;
     background:rgba(255,255,255,.6);cursor:pointer;font:600 15px 'Source Sans 3';color:#4b1519}
  .choice input{position:absolute;opacity:0;pointer-events:none}
  .choice small{display:block;font:400 12.5px 'Source Sans 3';color:#7a5d4b;margin-top:2px}
  .choice:has(input:checked){background:linear-gradient(180deg,#c9a04f,#9c6e28);border-color:#8a5d22;color:#fff8ea}
  .choice:has(input:checked) small{color:#fbe9c6}
  .choice:has(input:focus-visible){box-shadow:0 0 0 3px rgba(201,160,79,.45)}
  .stepper{display:flex;align-items:center;gap:12px}
  .stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid #b4853a;background:rgba(255,255,255,.7);color:#4b1519;font-size:22px;cursor:pointer}
  .stepper output{min-width:40px;text-align:center;font:700 22px 'Source Sans 3';color:#4b1519}
  .only-yes{display:none}.attending .only-yes{display:block}
  [hidden]{display:none!important}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .send{margin-top:20px;width:100%;border:1.5px solid #8a5d22;border-radius:999px;padding:14px;cursor:pointer;
     background:linear-gradient(180deg,#c9a04f,#9c6e28);color:#fff8ea;font:700 16px 'Source Sans 3';letter-spacing:1px;box-shadow:0 3px 10px rgba(120,80,20,.25)}
  .send[disabled]{opacity:.7;cursor:progress}
  .formerr{margin-top:12px;font-size:14px;color:#a3162a;text-align:center;min-height:1em}
  .done{text-align:center;padding:10px 4px 4px}
  .done .tick{width:62px;height:62px;margin:6px auto 10px;border-radius:50%;display:grid;place-items:center;
     background:linear-gradient(180deg,#c9a04f,#9c6e28);color:#fff8ea}
  .done p{font-size:16px;line-height:1.5;margin-top:8px}
  .done .script{font:400 34px 'Great Vibes';color:#9c6e28;line-height:1.1}
  .linkbtn{margin-top:14px;background:none;border:0;color:#8a5d22;font:600 15px 'Source Sans 3';text-decoration:underline;cursor:pointer}
  /* ---------- music button ---------- */
  .music{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;
     width:42px;height:42px;border-radius:50%;border:1.5px solid #8a5d22;cursor:pointer;display:grid;place-items:center;padding:0;
     background:linear-gradient(180deg,#c9a04f,#9c6e28);color:#fff8ea;box-shadow:0 3px 8px rgba(90,55,15,.35);
     opacity:0;pointer-events:none;transition:opacity .6s 1.2s;-webkit-tap-highlight-color:transparent}
  body.open .music{opacity:1;pointer-events:auto}
  body.rsvp-open .music{opacity:0;pointer-events:none;transition-delay:0s}
  .music svg{width:20px;height:20px}
  .music .off{display:none}
  .music.muted .on{display:none}.music.muted .off{display:block}
  .music:not(.muted)::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid rgba(201,160,79,.6);animation:ring 2.4s ease-out infinite}
  @keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
  .music:focus-visible{outline:2px solid #fff8ea;outline-offset:3px}
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    .petals{display:none}
  }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<!-- Opening gate -->
<div class="gate" id="gate" role="button" tabindex="0" aria-label="Open the invitation">
  <div class="door l"></div><div class="door r"></div>
  <div class="seal">
    <span class="ring"><img src="assets/seal.webp" width="150" height="150" alt=""></span>
    <p>You're invited</p>
    <div class="tap">TAP TO OPEN</div>
  </div>
</div>

<main>
  <!-- ======= Animated card ======= -->
  <div class="card" id="card">
    <div class="paper bg" aria-hidden="true"></div>
    <svg viewBox="0 0 736 1308" preserveAspectRatio="xMinYMin meet" aria-hidden="true">
      <!-- banana leaf + bananas, top left -->
      <g class="a in-leaf"><image class="sway-leaf loop" href="assets/banana-leaf.png" x="0" y="67" width="326" height="350"/></g>
      <g class="a in-banana"><image class="sway-banana loop" href="assets/bananas.png" x="0" y="415" width="164" height="239"/></g>
    </svg>
    <svg viewBox="0 0 736 1308" preserveAspectRatio="xMaxYMin meet" aria-hidden="true">
      <!-- hanging lamps, top right -->
      <g class="a in-lamp1"><image class="swing1 loop" href="assets/lamp-left.png" x="480" y="0" width="100" height="229"/></g>
      <g class="a in-lamp2"><image class="swing2 loop" href="assets/lamp-right.png" x="615" y="0" width="100" height="338"/></g>
    </svg>
    <svg viewBox="0 0 736 1308" preserveAspectRatio="xMinYMax meet" aria-hidden="true">
      <!-- Ganesha lamp, bottom left -->
      <defs>
        <linearGradient id="goldName" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="560" y2="0">
          <stop offset="0" stop-color="#93621f"/>
          <stop offset=".38" stop-color="#b4853a"/>
          <stop offset=".5" stop-color="#e3be6c"/>
          <stop offset=".62" stop-color="#b4853a"/>
          <stop offset="1" stop-color="#93621f"/>
          <animateTransform attributeName="gradientTransform" type="translate"
             values="-420 0; -420 0; 420 0" keyTimes="0; .55; 1" dur="6s" begin="4s" repeatCount="indefinite"/>
        </linearGradient>
        <radialGradient id="halo"><stop offset="0" stop-color="#ffd98a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
      </defs>
      <g class="a in-ganesha">
        <ellipse class="glow loop" cx="125" cy="960" rx="70" ry="80" fill="url(#halo)"/>
        <image href="assets/ganesha-lamp.png" x="0" y="886" width="285" height="422"/>
      </g>
    </svg>
    <svg viewBox="0 0 736 1308" preserveAspectRatio="xMaxYMax meet" aria-hidden="true">
      <!-- bird lamp and lotus, bottom right -->
      <g class="a in-lotus"><image class="bob loop" href="assets/lotus-pot-right.png" x="445" y="1230" width="167" height="78"/></g>
      <g class="a in-bird">
        <ellipse class="glow loop" cx="668" cy="1080" rx="45" ry="50" fill="url(#halo)" style="animation-delay:3.4s"/>
        <image href="assets/bird-lamp.png" x="612" y="1052" width="114" height="256"/>
      </g>
    </svg>
    <svg viewBox="0 0 736 1308" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Engagement ceremony of Sweekruti and Siddhanth, 10th December 2026, 11:30 AM onwards, The Brick House and Banquets, Kharghar">
      <!-- text -->
      <g text-anchor="middle" fill="#4b1519">
        <text class="a t t1" x="381" y="362"><tspan font-family="Pinyon Script" font-size="60.5" stroke="#4b1519" stroke-width="1.1">E</tspan><tspan font-family="Cinzel" font-weight="500" font-size="40.5">NGAGEMENT</tspan></text>
        <text class="a t t1" x="381" y="410" font-family="Cinzel"><tspan font-weight="500" font-size="49.5">C</tspan><tspan font-weight="500" font-size="40.5">EREMONY</tspan></text>

        <g font-family="Source Sans 3" font-weight="500" font-size="22.5" fill="#3b1f1b">
          <text class="a t t2" x="381" y="467">With the blessings of our families,</text>
          <text class="a t t3" x="381" y="494">we warmly invite our friends and family</text>
          <text class="a t t4" x="381" y="521">to celebrate the engagement of</text>
        </g>

        <g font-family="Great Vibes" fill="url(#goldName)">
          <text class="a t t5" x="381" y="603" font-size="62.5">Sweekruti</text>
          <text class="a t t6" x="381" y="668" font-size="52.5">&amp;</text>
          <text class="a t t7" x="381" y="730" font-size="62.5">Siddhanth</text>
        </g>

        <g font-family="Source Sans 3" fill="#3b1f1b">
          <text class="a t t8" x="381" y="777" font-size="22.5" font-weight="500">on</text>
          <text class="a t t9" x="381" y="814" font-size="29.5" font-weight="700" fill="#4b1519">10<tspan font-size="17.5" dy="-11">th</tspan><tspan dy="11"> DECEMBER 2026 | THURSDAY</tspan></text>
          <text class="a t t10" x="381" y="843" font-size="21.5" font-weight="600">11:30 AM ONWARDS</text>
          <text class="a t t11" x="381" y="893" font-size="22.5" font-weight="500">Venue:</text>
          <text class="a t t12" x="381" y="922" font-size="22.5" font-weight="600">THE BRICK HOUSE AND BANQUETS</text>
          <text class="a t t13" x="381" y="946" font-size="19" font-weight="500">Sector 6, Kharghar, Panvel, Maharashtra 410210</text>
        </g>


      <!-- RSVP (opens the reply form) and Maps buttons -->
      <defs><linearGradient id="btnGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a04f"/><stop offset="1" stop-color="#9c6e28"/></linearGradient></defs>
      <a class="a t t15 cardbtn" href="https://maps.google.com/?q=The+Brick+House+and+Banquets+Kharghar" target="_blank" rel="noopener" aria-label="Open the venue in Google Maps">
        <rect x="221" y="976" width="320" height="66" rx="33" fill="url(#btnGold)" stroke="#8a5d22" stroke-width="1.5" style="filter:drop-shadow(0 3px 5px rgba(90,55,15,.3))"/>
        <rect x="226" y="981" width="310" height="56" rx="28" fill="none" stroke="#f3dca2" stroke-opacity=".55" stroke-width="1"/>
        <g transform="translate(262 994)" fill="none" stroke="#fff8ea" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 30s11-9.5 11-18.5a11 11 0 1 0-22 0C3 20.5 14 30 14 30z"/><circle cx="14" cy="11.5" r="4"/>
        </g>
        <text x="398" y="1017" text-anchor="middle" font-family="Source Sans 3" font-weight="700" font-size="24" letter-spacing="1" fill="#fff8ea">OPEN IN MAPS</text>
      </a>
      <a class="a t t16 cardbtn" id="rsvpOpen" href="#rsvp" role="button" aria-label="RSVP: reply to the invitation">
        <rect x="241" y="1058" width="280" height="54" rx="27" fill="#fbf7ef" fill-opacity=".85" stroke="#b4853a" stroke-width="1.6"/>
        <g transform="translate(300 1071)" fill="none" stroke="#8a5d22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1.5" y="4" width="25" height="19" rx="2.5"/><path d="M2.5 6l11.5 8.5L25.5 6"/>
        </g>
        <text x="398" y="1093" text-anchor="middle" font-family="Source Sans 3" font-weight="700" font-size="20" letter-spacing="1.5" fill="#4b1519">RSVP</text>
      </a>
    </svg>
    <div class="petals" id="petals" aria-hidden="true"></div>
  </div>

</main>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="shade" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="rsvpTitle">
    <button class="x" type="button" data-close aria-label="Close">&times;</button>
    <h2 id="rsvpTitle">RSVP</h2>

    <form id="rsvpForm" novalidate>
      <div class="f" id="f-name"><label for="r-name">Your name</label>
        <input id="r-name" name="fullname" type="text" autocomplete="name" maxlength="80" required>
        <p class="err">Enter your name.</p></div>
      <div class="f" id="f-phone"><label for="r-phone">Phone number</label>
        <input id="r-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="98765 43210" required>
        <p class="hint">Use the same number if you need to change your reply later.</p>
        <p class="err">Enter a valid phone number.</p></div>
      <fieldset class="f" id="f-att"><legend>Will you join us?</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="att" value="yes">Joyfully accept<small>I'll be there</small></label>
          <label class="choice"><input type="radio" name="att" value="no">Regretfully decline<small>I can't make it</small></label>
        </div>
        <p class="err">Choose one.</p></fieldset>
      <div class="f only-yes"><label id="l-guests">Number of guests, including you</label>
        <div class="stepper" role="group" aria-labelledby="l-guests">
          <button type="button" data-step="-1" aria-label="One fewer guest">&minus;</button>
          <output id="r-guests" aria-live="polite">1</output>
          <button type="button" data-step="1" aria-label="One more guest">+</button>
        </div>
        </div>
      <fieldset class="f only-yes" id="f-diet"><legend>Food preference</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="diet" value="veg">Veg</label>
          <label class="choice"><input type="radio" name="diet" value="non-veg">Non-veg</label>
        </div>
        <p class="err">Choose one.</p></fieldset>
      <div class="f"><label for="r-msg">A message for the couple <span style="font-weight:400;color:#7a5d4b">(optional)</span></label>
        <textarea id="r-msg" name="msg" maxlength="500"></textarea></div>
      <div class="hp" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
      <button class="send" type="submit">Send reply</button>
      <p class="formerr" id="formErr" role="alert"></p>
    </form>

    <div class="done" id="rsvpDone" hidden>
      <div class="tick"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div class="script" id="doneTitle">Thank you</div>
      <p id="doneText"></p>
      <button class="linkbtn" type="button" id="rsvpEdit">Change my reply</button>
    </div>

  </div>
</div>

<audio id="bgm" src="assets/music.m4a" loop preload="none"></audio>
<button class="music" id="musicBtn" type="button" aria-label="Mute music" aria-pressed="false">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M3 3l18 18"/></svg>
</button>

<script>
(() => {
  const body = document.body;

  /* ---- gate ---- */
  const gate = document.getElementById('gate');
  function openInvite(){
    if (body.classList.contains('open')) return;
    body.classList.add('open');
    startPetals();
    startMusic();
    setTimeout(() => body.classList.add('gone'), 1500);
  }
  gate.addEventListener('click', openInvite);
  gate.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openInvite(); } });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelectorAll('animateTransform').forEach(a => a.remove());

  /* ---- music: "A Sacred Carnatic Wedding Melody" (NirvanaSutra Music), same as the wedding invite ---- */
  const bgm = document.getElementById('bgm');
  const btn = document.getElementById('musicBtn');
  const TARGET = 0.6;
  let wantMusic = true, fadeTimer = null;
  try { wantMusic = localStorage.getItem('invite-music') !== 'off'; } catch (e) {}
  function show(on){
    btn.classList.toggle('muted', !on);
    btn.setAttribute('aria-pressed', String(!on));
    btn.setAttribute('aria-label', on ? 'Mute music' : 'Play music');
  }
  function fadeTo(v, ms, done){
    clearInterval(fadeTimer);
    const start = bgm.volume, t0 = performance.now();
    fadeTimer = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / ms);
      bgm.volume = start + (v - start) * k;
      if (k === 1){ clearInterval(fadeTimer); if (done) done(); }
    }, 40);
  }
  function play(){
    bgm.volume = 0;
    const p = bgm.play();
    show(true);
    if (p) p.then(() => fadeTo(TARGET, 2500)).catch(() => show(false));  // blocked until the guest taps
    else fadeTo(TARGET, 2500);
  }
  function pause(){ show(false); fadeTo(0, 400, () => bgm.pause()); }
  function startMusic(){ if (wantMusic) play(); else show(false); }
  btn.addEventListener('click', () => {
    wantMusic = bgm.paused || btn.classList.contains('muted');
    try { localStorage.setItem('invite-music', wantMusic ? 'on' : 'off'); } catch (e) {}
    wantMusic ? play() : pause();
  });
  document.addEventListener('visibilitychange', () => {
    if (!body.classList.contains('open')) return;
    if (document.hidden) { clearInterval(fadeTimer); bgm.pause(); }
    else if (wantMusic && !btn.classList.contains('muted')) play();
  });

  /* ---- RSVP: replies are saved in Supabase through submit_engagement_rsvp ---- */
  const SUPABASE_URL = 'https://reikygaktingpoworigo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_at4oHM7xUcFk-1tckqBw6w_WeuYj_rx';   // publishable key: safe in the page
  const sheet = document.getElementById('sheet'), form = document.getElementById('rsvpForm');
  const doneBox = document.getElementById('rsvpDone');
  const errBox = document.getElementById('formErr'), sendBtn = form.querySelector('.send');
  const guestsOut = document.getElementById('r-guests');
  let guests = 1, lastFocus = null;
  const nameIn = document.getElementById('r-name');   // not form.name: that is the form's own name
  const store = { get(){ try { return JSON.parse(localStorage.getItem('invite-rsvp') || 'null'); } catch (e) { return null; } },
                  set(v){ try { localStorage.setItem('invite-rsvp', JSON.stringify(v)); } catch (e) {} } };

  function setGuests(n){ guests = Math.max(1, Math.min(10, n)); guestsOut.textContent = guests; }
  function attending(){ const c = form.querySelector('input[name=att]:checked'); return c ? c.value === 'yes' : null; }
  function syncAtt(){ form.classList.toggle('attending', attending() === true); }
  function dietChoice(){ const c = form.querySelector('input[name=diet]:checked'); return c ? c.value : ''; }
  function view(which){
    form.hidden = which !== 'form'; doneBox.hidden = which !== 'done';
  }
  function showDone(r, updated){
    document.getElementById('doneTitle').textContent = 'Thank you, ' + r.name.split(' ')[0] + '!';
    document.getElementById('doneText').textContent = r.attending
      ? (updated ? 'Your reply is updated. ' : '') + 'We can\'t wait to celebrate with you' +
        (r.guests > 1 ? ' and your ' + (r.guests - 1 === 1 ? 'guest' : (r.guests - 1) + ' guests') : '') + ' on 10th December.'
      : (updated ? 'Your reply is updated. ' : '') + 'We\'ll miss you, and we\'re grateful for your wishes.';
    view('done');
  }
  function fill(r){
    nameIn.value = r.name || ''; form.phone.value = r.phone || '';
    form.querySelectorAll('input[name=att]').forEach(i => i.checked = (i.value === 'yes') === r.attending);
    setGuests(r.guests || 1); form.querySelectorAll('input[name=diet]').forEach(i => i.checked = i.value === r.dietary); form.msg.value = r.message || '';
    syncAtt();
  }
  function openSheet(e){
    if (e) e.preventDefault();
    lastFocus = document.activeElement;
    const saved = store.get();
    if (saved) { fill(saved); showDone(saved, false); } else view('form');
    sheet.classList.add('show'); sheet.setAttribute('aria-hidden', 'false'); body.classList.add('rsvp-open');
    setTimeout(() => { const t = sheet.querySelector(form.hidden ? '.x' : '#r-name'); if (t) t.focus({ preventScroll: true }); }, 350);
  }
  function closeSheet(){
    sheet.classList.remove('show'); sheet.setAttribute('aria-hidden', 'true'); body.classList.remove('rsvp-open');
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  function mark(id, bad){ document.getElementById(id).classList.toggle('bad', bad); return bad; }

  document.getElementById('rsvpOpen').addEventListener('click', openSheet);
  document.getElementById('rsvpOpen').addEventListener('keydown', e => { if (e.key === ' ') openSheet(e); });
  sheet.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeSheet));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('show')) closeSheet(); });
  form.querySelectorAll('input[name=att]').forEach(i => i.addEventListener('change', () => { syncAtt(); mark('f-att', false); }));
  form.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => setGuests(guests + Number(b.dataset.step))));
  form.querySelectorAll('input[name=diet]').forEach(i => i.addEventListener('change', () => mark('f-diet', false)));
  nameIn.addEventListener('input', () => mark('f-name', false));
  form.phone.addEventListener('input', () => mark('f-phone', false));
  document.getElementById('rsvpEdit').addEventListener('click', () => { view('form'); nameIn.focus(); });

  const MESSAGES = {
    RSVP_CLOSED: 'RSVPs have closed. Please contact Sweekruti or Siddhanth directly.',
    BAD_PHONE: 'That phone number doesn\'t look right. Check it and try again.',
    BAD_NAME: 'Enter your name.', BAD_GUESTS: 'Choose between 1 and 10 guests.', BAD_ATTENDING: 'Choose whether you can come.', BAD_DIET: 'Choose Veg or Non-veg.'
  };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (sendBtn.disabled) return;
    errBox.textContent = '';
    if (form.website.value) return;                                         // bots fill this in; people never see it
    const name = nameIn.value.trim(), phone = form.phone.value.trim(), att = attending();
    const digits = phone.replace(/\D/g, '');
    const bad = [mark('f-name', name.length < 2), mark('f-phone', digits.length < 10 || digits.length > 15), mark('f-att', att === null),
                 mark('f-diet', att === true && !dietChoice())];
    if (bad.some(Boolean)) { const f = form.querySelector('.bad input'); if (f) f.focus(); return; }
    const r = { name, phone, attending: att, guests: att ? guests : 0, dietary: att ? dietChoice() : 'none',
                message: form.msg.value.trim() };
    sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/submit_engagement_rsvp', {
        method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY },
        body: JSON.stringify({ p_full_name: r.name, p_phone: r.phone, p_attending: r.attending, p_guest_count: r.guests,
                               p_dietary: r.dietary, p_message: r.message || null })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (data.message === 'BAD_PHONE') mark('f-phone', true);
        throw new Error(MESSAGES[data.message] || 'Your reply couldn\'t be sent. Please try again.');
      }
      store.set(r);
      showDone(r, data.updated);
      sheet.querySelector('.x').focus({ preventScroll: true });
    } catch (err) {
      errBox.textContent = err.message && !/fetch|network/i.test(err.message) ? err.message : 'You seem to be offline. Check your connection and try again.';
    } finally { sendBtn.disabled = false; sendBtn.textContent = 'Send reply'; }
  });
  if (location.hash === '#rsvp') setTimeout(openSheet, 300);

  /* ---- falling petals ---- */
  function startPetals(){
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const box = document.getElementById('petals');
    for (let i = 0; i < 14; i++){
      const p = document.createElement('i');
      p.className = 'petal' + (i % 4 === 0 ? ' m' : '');
      const size = 1.4 + Math.random() * 1.1;
      p.style.left = (Math.random() * 96) + '%';
      p.style.width = 'calc(' + (size / 2).toFixed(2) + ' * clamp(7px, .9vmax, 12px))';
      p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      p.style.setProperty('--r', (Math.random() * 540 - 270) + 'deg');
      p.style.animationDuration = (9 + Math.random() * 8) + 's';
      p.style.animationDelay = (2 + Math.random() * 10) + 's';
      box.appendChild(p);
    }
  }

  // open straight away when asked to (or when motion is reduced)
  if (location.hash === '#open' || matchMedia('(prefers-reduced-motion: reduce)').matches) openInvite();
})();
</script>
</body>
</html>
